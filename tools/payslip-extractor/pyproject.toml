[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payslip-extractor"
version = "0.1.0"
description = "Local, fully offline extraction of SA payslip line items into the SARS Auto-Assessment Calculator's JSON import format."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["payslip_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
